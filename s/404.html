<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https://i.ytimg.com; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>A song for you · Kira Music</title>
<style>
  :root { color-scheme: dark; --bg: #0b0a14; --card: #17152a; --text: #f2f5ff; --muted: #a9b0cc; --accent: #a78bfa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 500px at 20% 0%, #2a2150 0%, transparent 60%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(440px, 100%); background: var(--card); border: 1px solid #ffffff1a; border-radius: 24px; padding: 28px; text-align: center; box-shadow: 0 30px 80px -30px #000; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 18px; color: var(--muted); }
  .brand { font-weight: 800; letter-spacing: -0.02em; margin-bottom: 18px; }
  .brand b { color: var(--accent); font-weight: 800; }
  a.btn { display: block; margin: 10px 0; padding: 13px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; color: var(--text); background: #ffffff14; }
  a.btn.primary { background: var(--accent); color: #0b0a14; }
  a.btn:hover { filter: brightness(1.12); }
  small { display: block; margin-top: 18px; color: var(--muted); font-size: 13px; }
  small a { color: var(--accent); }
  .cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; margin-bottom: 16px; background: #ffffff10; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; border-radius: 16px; overflow: hidden; }
  .grid img, .grid i { width: 100%; aspect-ratio: 1; object-fit: cover; background: linear-gradient(135deg, #3a2f78, #17152a); display: block; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">Kira <b>Music</b></div>
  <section id="ok" hidden>
    <img class="cover" id="cover" alt="" hidden>
    <div class="grid" id="grid" hidden></div>
    <h1 id="t-title">Somebody shared a song with you</h1>
    <p id="t-sub">Open it in Kira Music to listen.</p>
    <a class="btn primary" id="open" href="#">Open in Kira Music</a>
    <a class="btn" id="site" href="#" rel="noopener noreferrer">Listen on its own site</a>
    <small><span id="t-get">Do not have Kira Music yet?</span> <a id="get" href="https://github.com/Neversleeper/kira-music-releases/releases/latest" rel="noopener noreferrer">Get it</a></small>
  </section>
  <section id="bad" hidden>
    <h1 id="t-bad">This link does not work</h1>
    <p id="t-bad-sub">It is not a link to a song of YouTube or SoundCloud.</p>
  </section>
</main>
<script src="/kira-music-releases/s/s.js"></script>
</body>
</html>
