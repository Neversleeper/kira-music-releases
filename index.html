<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Kira Music: a fast and private music player for your computer.">
<title>Kira Music</title>
<style>
  :root { color-scheme: dark; --bg: #0b0a14; --card: #17152a; --text: #f2f5ff; --muted: #a9b0cc; --accent: #a78bfa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 500px at 20% 0%, #2a2150 0%, transparent 60%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(440px, 100%); background: var(--card); border: 1px solid #ffffff1a; border-radius: 24px; padding: 28px; text-align: center; box-shadow: 0 30px 80px -30px #000; }
  .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 28px; margin-bottom: 6px; }
  .brand b { color: var(--accent); font-weight: 800; }
  p { margin: 0 0 22px; color: var(--muted); }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
  small a { color: var(--accent); }
  a.btn { display: block; padding: 13px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; color: #0b0a14; background: var(--accent); }
  a.btn:hover { filter: brightness(1.12); }
</style>
</head>
<body>
<main>
  <div class="brand">Kira <b>Music</b></div>
  <p>A fast and private music player for your computer.</p>
  <a class="btn" href="https://github.com/Neversleeper/kira-music-releases/releases/download/v__VERSION__/Kira-Music-Setup-__VERSION__.exe" rel="noopener noreferrer">Download for Windows (v__VERSION__)</a>
  <small>Windows may warn that the publisher is unknown: choose <b>More info</b>, then <b>Run anyway</b>. <a href="https://github.com/Neversleeper/kira-music-releases/releases/latest" rel="noopener noreferrer">Other downloads</a></small>
</main>
</body>
</html>
