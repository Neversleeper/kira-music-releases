<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Email confirmed · Kira Music</title>
<style>
  :root { color-scheme: dark; --bg: #0b0a14; --card: #17152a; --text: #f2f5ff; --muted: #a9b0cc; --accent: #a78bfa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 500px at 20% 0%, #2a2150 0%, transparent 60%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(440px, 100%); background: var(--card); border: 1px solid #ffffff1a; border-radius: 24px; padding: 28px; text-align: center; box-shadow: 0 30px 80px -30px #000; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .brand { font-weight: 800; letter-spacing: -0.02em; margin-bottom: 18px; }
  .brand b { color: var(--accent); font-weight: 800; }
  .tick { font-size: 40px; margin-bottom: 8px; }
  hr { border: 0; border-top: 1px solid #ffffff1a; margin: 18px 0; }
</style>
</head>
<body>
<main>
  <div class="brand">Kira <b>Music</b></div>
  <div class="tick">✓</div>
  <h1>Your email is confirmed</h1>
  <p>You can close this page and go back to Kira Music.</p>
  <hr>
  <h1>Tu correo está confirmado</h1>
  <p>Ya puedes cerrar esta página y volver a Kira Music.</p>
</main>
</body>
</html>
